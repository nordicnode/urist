# Ruff lint — runs on every push (and PR).
#
# Enforces the pyflakes rules (F) from ruff.toml: undefined names,
# unused imports/locals, redefinitions. The generated protobuf stubs
# are excluded in ruff.toml (never hand-edit them). Style rules (UP,
# RUF, ...) are deliberately NOT enforced — the project never adopted
# them (see ruff.toml).
name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff check
        run: python -m ruff check src scripts tests
