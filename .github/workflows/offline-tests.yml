# Offline test suite — runs on every push (and PR).
#
# Runs ONLY the AGENTS.md offline invocation. It never touches the game:
# every *_live.py file is ignored and the six live classes that live in
# non-live files are deselected by exact class name. Do NOT simplify the
# -k filter to "not live": -k matching is case-insensitive, so "live"
# also deselects the scoring tests whose names contain "lives".
# A partial ignore once ran live tests against the game and advanced it
# to tick 135706.
name: Offline tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The deblibs (extracted SDL/GTK/GL .debs under scratch/deblibs)
      # live only on the dev VM — scratch/ is gitignored. The reload
      # tests assert launch_env() includes them when present, so CI
      # provides the six package dirs as empty fixtures: that exercises
      # the real path-assembly code (dir discovery, all six pkgs) without
      # the actual libraries, which the tests never load.
      - name: Provide stub deblibs dirs
        run: |
          for pkg in libsdl1.2debian libsdl-image1.2 libsdl-ttf2.0-0 libgtk2.0-0t64 libglu1-mesa libgl1; do
            mkdir -p "scratch/deblibs/$pkg/usr/lib/x86_64-linux-gnu"
          done

      - name: Offline test suite
        run: >-
          python -m pytest tests/ -q
          --ignore-glob='tests/*_live.py'
          -k "not TestBriefingsLive and not TestCatalogLive and not TestDiagnoseLive and not TestSitesLive and not TestTasksLive and not TestWikiLive"
